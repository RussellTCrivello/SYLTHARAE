# Continuous integration: the release gates of docs/TESTING.md, on every push
# and pull request. Nothing here may pass by skipping: PostgreSQL and Node.js
# are required (REQUIRE_POSTGRES, the node check), not optional.
name: CI

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.11, PostgreSQL, Node.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REQUIRE_POSTGRES: "1"          # tests/conftest.py: no database = failure
      NGINX_BIN: /usr/sbin/nginx     # tests/integration/test_deploy_nginx.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: System packages (docs/INSTALL.md, Debian/Ubuntu) and nginx
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3 python3-venv python3-dev build-essential \
              postgresql postgresql-contrib libpq-dev \
              tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-heb \
              ffmpeg libgl1 libglib2.0-0 \
              nginx

      - name: Install (docs/INSTALL.md steps 3-4, with every extra)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[pdf,office,ocr,ebook,audio,media,server,dev]"

      - name: Dependency consistency
        run: pip check

      - name: Required tools are present (no silent skips)
        run: |
          node --version
          nginx -v
          python -c "import pgserver, cv2, pymupdf, waitress; print('ok')"

      # Fails here, with the stage and a remediation, when tesseract or a
      # language pack is missing or cannot read a clean sample, rather than
      # as scattered OCR test failures later. Turned/small samples are
      # reported; the test suite asserts them.
      - name: OCR engine self-check (tesseract required, heb/eng/ara)
        run: python tools/ci/ocr_selfcheck.py --require tesseract --languages heb,eng,ara --json ocr-selfcheck.json

      - name: Keep the OCR self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-selfcheck
          path: ocr-selfcheck.json
          if-no-files-found: warn

      - name: Test suites (unit, integration, security, e2e, front end, docs)
        run: python -m pytest tests -p no:cacheprovider -q -rfEs --junitxml=pytest-report.xml

      - name: Report test results as annotations
        if: always()
        run: test -f pytest-report.xml && python tools/ci/junit_annotations.py pytest-report.xml || true

      - name: Package build
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w dist .
          python - <<'EOF'
          import email, glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              meta = email.message_from_bytes(z.read(next(n for n in z.namelist() if n.endswith("METADATA"))))
          print(wheel, meta["Version"], meta["License-Expression"])
          assert meta["License-Expression"] == "AGPL-3.0-or-later"
          EOF

  static:
    name: Static analysis and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e ".[pdf,office,ocr,ebook,audio,media,server,dev]" pip-audit

      # Correctness rules only: the full rule set carries pre-existing debt
      # (AUDIT_REPORT.md, residual LINT-02) that is not a gate yet.
      - name: Ruff (syntax errors, undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      # Medium+ findings not in the baseline fail. The baseline holds only the
      # documented residuals SQL-01 (B608), XML-01 (B314) and BIND-01 (B104).
      - name: Bandit (new findings against the baseline)
        run: bandit -q -c pyproject.toml -r . -ll -b tools/security/bandit-baseline.json

      - name: pip-audit (known vulnerabilities)
        run: pip-audit --progress-spinner off --skip-editable

      - name: Licence compatibility (AGPL-3.0-or-later)
        run: python tools/licenses/check_licenses.py
