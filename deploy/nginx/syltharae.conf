# SYLTHARAE behind nginx with TLS.
#
# Install:  copy to /etc/nginx/sites-available/syltharae.conf (or conf.d/),
#           replace syltharae.example.org and the certificate paths,
#           then `nginx -t && systemctl reload nginx`.
# App side (.env) - see docs/OPERATIONS.md "Reverse proxy and TLS":
#           FLASK_ENV=production  WSGI_SERVER=waitress
#           FLASK_HOST=127.0.0.1  FLASK_PORT=5000  TRUSTED_PROXY_COUNT=1
#
# Tested with nginx 1.24 (CI) and 1.26 by tests/integration/test_deploy_nginx.py,
# and end to end with tools/smoke/live_smoke.py over HTTPS through this file.

upstream syltharae_app {
    server 127.0.0.1:5000;                 # FLASK_HOST:FLASK_PORT
    keepalive 16;
}

# Plain HTTP only redirects (and serves ACME challenges for certificate renewal).
server {
    listen 80;
    listen [::]:80;
    server_name syltharae.example.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on every nginx with HTTP/2; nginx 1.25.1+ also
    # accepts the newer "http2 on;" directive. HTTP/2 matters here because each
    # open Jobs page holds one event stream, and HTTP/1.1 browsers allow only
    # six connections per host.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name syltharae.example.org;
    server_tokens off;

    ssl_certificate     /etc/ssl/certs/syltharae.pem;        # full chain
    ssl_certificate_key /etc/ssl/private/syltharae.key;

    # Mozilla "intermediate" TLS configuration.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SYLTHARAE_TLS:10m;
    ssl_session_tickets off;

    # HTTP/2 connection lifetime. After keepalive_requests requests nginx sends
    # GOAWAY, and browsers do not reliably retry the requests they had already
    # started on that connection (nginx ticket #2155): a page then loads with
    # scripts missing and its buttons do nothing. Every page here makes ~50
    # requests, so the default of 1000 was reached every ~20 page views (the
    # browser smoke caught it). keepalive_time bounds the connection instead.
    keepalive_requests 100000;
    keepalive_time 1h;

    # Largest upload = OPERATIONS_MAX_UPLOAD_MB (default 2048 MB).
    client_max_body_size 2g;

    # Security headers (CSP, HSTS, X-Frame-Options, ...) come from the
    # application, which sends HSTS only in production over HTTPS. Do not add
    # them here too: duplicated headers are combined by browsers.

    location / {
        proxy_pass http://syltharae_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # With TRUSTED_PROXY_COUNT=1 the app believes exactly these headers.
        # X-Forwarded-For is OVERWRITTEN with the connecting address, so a
        # client cannot smuggle a forged address through the proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Large uploads, long exports and the job event streams. The streams
        # send "X-Accel-Buffering: no", so nginx passes them through unbuffered.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
